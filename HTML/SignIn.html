<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EAO Bank — Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/generalStyles.css" />
    <link rel="stylesheet" href="../CSS/signIn.css" />

</head>


<body>
    <div class="auth-card">
        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-landmark"></i>
            </div>
            <div class="brand-name">EAO <span>Bank</span></div>
        </div>

        <h1 class="auth-heading">Welcome back</h1>
        <p class="auth-subheading">Sign in to access your account</p>


        <form id="loginForm" novalidate>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@EAOBank.com" autocomplete="email" required />
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" id="password" name="password" placeholder="Enter your password"
                        autocomplete="current-password" required />

                    <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>


            <button type="submit" class="btn-primary" id="loginBtn">Login</button>


            <div class="message" id="message"></div>

        </form>

        <hr class="divider"/>

        <p class="auth-link">
            Don't have an account? <a href="signup.html">Create one</a>
        </p>

    </div>


    <script type="module" src="../Javascript/signIn.js"></script>

</body>

</html>
