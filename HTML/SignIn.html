<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EAO Bank — Login</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../CSS/generalStyles.css"/>
  <link rel="stylesheet" href="../CSS/signIn.css"/>
</head>
<body>

  <div class="auth-card">

    <!-- Brand -->
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-landmark"></i></div>
      <div class="brand-name">EAO <span>Bank</span></div>
    </div>

    <!-- ── LOGIN SECTION ── -->
    <div id="loginSection">
      <h1 class="auth-heading">Welcome back</h1>
      <p class="auth-subheading">Sign in to access your account</p>

      <form id="loginForm" novalidate>
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrapper">
            <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password" required/>
            <button type="button" class="toggle-password" id="togglePassword" aria-label="Toggle password">
              <i class="fa-solid fa-eye"></i>
            </button>
          </div>
          <!-- Forgot password link -->
          <div class="forgot-link-wrapper">
            <button type="button" class="forgot-link" id="showForgotBtn">
              Forgot password?
            </button>
          </div>
        </div>

        <button type="submit" class="btn-primary" id="loginBtn">Login</button>
        <div class="message" id="message"></div>
      </form>

      <hr class="divider"/>
      <p class="auth-link">Don't have an account? <a href="signUp.html">Create one</a></p>
    </div>

    <!-- ── FORGOT PASSWORD SECTION (hidden by default) ── -->
    <div id="forgotSection" style="display:none;">
      <h1 class="auth-heading">Reset Password</h1>
      <p class="auth-subheading">Enter your email and we'll send you a reset link</p>

      <form id="forgotForm" novalidate>
        <div class="form-group">
          <label for="resetEmail">Email Address</label>
          <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email" required/>
        </div>

        <button type="submit" class="btn-primary" id="resetBtn">Send Reset Link</button>
        <div class="message" id="forgotMessage"></div>
      </form>

      <hr class="divider"/>
      <p class="auth-link">
        <button type="button" class="forgot-link" id="backToLoginBtn">
          <i class="fa-solid fa-arrow-left"></i> Back to Login
        </button>
      </p>
    </div>

  </div>

  <script type="module" src="../Javascript/signIn.js"></script>
</body>
</html>
