<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EAO Bank — Deposit</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../CSS/generalStyles.css"/>
  <link rel="stylesheet" href="../CSS/deposit.css"/>
</head>
<body>
<div style="background: #ffcc00; padding: 10px; text-align: center; font-weight: bold;">
  ⚠️ This is a demo project for learning purposes only. Not a real bank.
</div>

  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo"><i class="fa-solid fa-landmark"></i></div>
      <span class="nav-title">EAO <strong>Bank</strong></span>
    </div>
    <div class="nav-right">
      <span class="nav-greeting" id="navGreeting">Hello…</span>
    </div>
  </nav>


  <main class="page-main">

   
    <a href="./dashboard.html" class="back-link">
      <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
    </a>

   
    <div class="page-card">

      
      <div class="page-card-header deposit-header">
        <div class="page-card-icon">
          <i class="fa-solid fa-arrow-down-to-line"></i>
        </div>
        <div>
          <h1 class="page-card-title">Make a Deposit</h1>
          <p class="page-card-sub">Funds will reflect in your account instantly</p>
        </div>
      </div>

     
      <div class="balance-preview">
        <span class="balance-label">Current Balance</span>
        <span class="balance-amount" id="currentBalance">Loading…</span>
      </div>

      
      <form id="depositForm" novalidate>

        
        <div class="form-group">
          <label for="amount">Amount ($)</label>
          <div class="input-prefix-wrapper">
            <span class="input-prefix">$</span>
            <input type="number" id="amount" placeholder="0.00" min="1" step="0.01" required/>
          </div>
        </div>

    
        <div class="form-group">
          <label for="description">
            Description <span class="optional">(optional)</span>
          </label>
          <input type="text" id="description" placeholder="e.g. Salary, Business income…"/>
        </div>

        
        <button type="submit" class="btn-action deposit-btn" id="depositBtn">
          <i class="fa-solid fa-arrow-down-to-line"></i> Deposit Funds
        </button>

        
        <div class="message" id="message"></div>

      </form>

    </div>
  </main>

  <script type="module" src="../Javascript/deposit.js"></script>
</body>
</html>
