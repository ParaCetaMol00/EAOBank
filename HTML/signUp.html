<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EAO Bank — Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link rel="stylesheet" href="../CSS/generalStyles.css" />
    <link rel="stylesheet" href="../CSS/signUp.css" />
</head>

<body>

    <div class="auth-card">


        <div class="brand">
            <div class="brand-icon">
                <i class="fa-solid fa-landmark"></i>
            </div>
            <div class="brand-name">EAO <span>Bank</span></div>
        </div>

        <h1 class="auth-heading">Open an account</h1>
        <p class="auth-subheading">Join EAO Bank and start banking smarter</p>


        <form id="signupForm" novalidate>


            <div class="form-group">
                <label for="fullName">Full Name</label>
                <input type="text" id="fullName" name="fullName" placeholder="EAO Bank" autocomplete="name" required />
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="you@EAOBank.com" autocomplete="email"
                    required />
            </div>


            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="08012345678" autocomplete="tel" required />
            </div>

            <div class="form-group">
                <label for="accountType">Account Type</label>
                <div class="select-wrapper">
                    <select id="accountType" name="accountType" required>
                        <option value="" disabled selected>Select account type</option>
                        <option value="Savings">Savings</option>
                        <option value="Current">Current</option>
                    </select>
                </div>
            </div>


            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" id="password" name="password" placeholder="At least 6 characters"
                        autocomplete="new-password" required />
                    <button type="button" class="toggle-password" id="togglePassword"
                        aria-label="Toggle password visibility">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">Confirm Password</label>
                <div class="input-icon-wrapper">
                    <input type="password" id="confirmPassword" name="confirmPassword"
                        placeholder="Re-enter your password" autocomplete="new-password" required />

                    <button type="button" class="toggle-password" id="toggleConfirmPassword"
                        aria-label="Toggle confirm password visibility">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>


            <button type="submit" class="btn-primary" id="signupBtn">Create Account</button>


            <div class="message" id="message"></div>

        </form>

        <hr class="divider" />

        <p class="auth-link">
            Already have an account? <a href="SignIn.html">Sign in</a>
        </p>
    </div>

    <script type="module" src="../Javascript/signUp.js"></script>

</body>

</html>
