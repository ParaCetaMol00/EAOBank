<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EAO Bank — Customer Support</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link rel="stylesheet" href="../CSS/generalStyles.css"/>
  <link rel="stylesheet" href="../CSS/support.css"/>
</head>
<body>

  
  <nav class="navbar">
    <div class="nav-brand">
      <div class="nav-logo"><i class="fa-solid fa-landmark"></i></div>
      <span class="nav-title">EAO <strong>Bank</strong></span>
    </div>
    <div class="nav-right">
      <a href="./dashboard.html" class="nav-link">Home</a>
      <a href="./SignIn.html" class="nav-link nav-link-btn">Login</a>
    </div>
  </nav>

  <main class="support-main">

    
    <div class="support-header">
      <div class="support-header-icon">
        <i class="fa-solid fa-headset"></i>
      </div>
      <div>
        <h1 class="support-title">Customer Support</h1>
        <p class="support-sub">We're here to help. Fill out the form and we'll get back to you.</p>
      </div>
    </div>

    <div class="support-layout">

      
      <div class="page-card support-card">

        <form id="supportForm" novalidate>

          
          <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Your full name" required/>
          </div>

          
          <div class="form-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="your@email.com" required/>
          </div>

          
          <div class="form-group">
            <label for="accountNumber">
              Account Number <span class="optional">(optional)</span>
            </label>
            <input type="text" id="accountNumber" placeholder="Your 10-digit account number" maxlength="10"/>
          </div>

          
          <div class="form-group">
            <label for="issueType">Issue Type</label>
            <div class="select-wrapper">
              <select id="issueType" required>
                <option value="" disabled selected>Select issue type</option>
                <option value="Account Blocked">Account Blocked</option>
                <option value="Transaction Issue">Transaction Issue</option>
                <option value="Login Problem">Login Problem</option>
                <option value="Other">Other</option>
              </select>
            </div>
          </div>

          
          <div class="form-group">
            <label for="message">Message</label>
            <textarea id="message" rows="5" placeholder="Describe your issue in detail…" required></textarea>
          </div>

          
          <button type="submit" class="btn-action primary-btn" id="submitBtn">
            <i class="fa-solid fa-paper-plane"></i> Submit Complaint
          </button>

          
          <div class="message" id="formMessage"></div>

        </form>
      </div>

      
      <div class="support-info">
        <div class="info-card">
          <div class="info-icon"><i class="fa-solid fa-clock"></i></div>
          <h3>Response Time</h3>
          <p>We typically respond within 24 hours on business days.</p>
        </div>
        <div class="info-card">
          <div class="info-icon"><i class="fa-solid fa-envelope"></i></div>
          <h3>Email Support</h3>
          <p>eaocreates@gmail.com</p>
        </div>
        <div class="info-card">
          <div class="info-icon"><i class="fa-solid fa-phone"></i></div>
          <h3>Phone Support</h3>
          <p>+234 800 EAO BANK<br/>Mon – Fri, 8am – 6pm</p>
        </div>
      </div>

    </div>
  </main>

  <script type="module" src="../Javascript/support.js"></script>
</body>
</html>
